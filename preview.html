<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Liya</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
radial-gradient(circle at top, rgba(255,255,255,.08), transparent 30%),
linear-gradient(to bottom,#000,#050505,#0a0a0a,#111);
color:white;
}

/* Bulan */
.moon{
position:fixed;
top:50px;
right:80px;
width:120px;
height:120px;
border-radius:50%;
background:#ddd;
box-shadow:
0 0 40px rgba(255,255,255,.4),
0 0 100px rgba(255,255,255,.2);
}

/* Bintang */
.star{
position:fixed;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:twinkle 3s infinite;
}

@keyframes twinkle{
0%,100%{opacity:.2;}
50%{opacity:1;}
}

/* Hujan */
.rain{
position:fixed;
width:100%;
height:100%;
}

.drop{
position:absolute;
width:2px;
height:80px;
background:rgba(255,255,255,.2);
animation:fall linear infinite;
}

@keyframes fall{
from{transform:translateY(-100px);}
to{transform:translateY(110vh);}
}

/* Kotak */
.container{
width:90%;
max-width:850px;
padding:30px;
text-align:center;
z-index:10;
}

.title{
font-size:40px;
color:#60a5fa;
margin-bottom:20px;
text-shadow:
0 0 10px #60a5fa,
0 0 20px #60a5fa;
}

.typing{
font-size:20px;
line-height:2;
white-space:pre-wrap;
color:#7dd3fc;
text-shadow:
0 0 10px rgba(125,211,252,.4);
}

.final{
opacity:0;
font-size:35px;
margin-top:30px;
color:#60a5fa;
transition:2s;
text-shadow:
0 0 10px #60a5fa,
0 0 30px #60a5fa;
}

.show{
opacity:1;
}
</style>
</head>

<body>

<div class="moon"></div>

<div class="rain" id="rain"></div>

<div class="container">
<div class="title">Untuk Liya 💙</div>

<div id="typing" class="typing"></div>

<div id="final" class="final">
❤️ Jangan pergi dari kakak ya ❤️
</div>
</div>

<script>

/* Bintang */
for(let i=0;i<120;i++){
let s=document.createElement('div');
s.className='star';
s.style.left=Math.random()*100+'vw';
s.style.top=Math.random()*70+'vh';
s.style.animationDelay=Math.random()*3+'s';
document.body.appendChild(s);
}

/* Hujan */
for(let i=0;i<180;i++){
let d=document.createElement('div');
d.className='drop';
d.style.left=Math.random()*100+'%';
d.style.animationDuration=(0.5+Math.random())+'s';
d.style.opacity=Math.random();
document.getElementById('rain').appendChild(d);
}

/* Pesan */
const text=`
Malam ini...

Di bawah hujan yang turun perlahan...

Aku hanya ingin menyampaikan sesuatu yang mungkin sudah lama ingin kusampaikan.

Hai Liya...

Aku, Mukhlis Abdillah.

Aku ingin meminta maaf dengan tulus apabila selama ini pernah mengusik kehidupanmu atau membuatmu tidak nyaman.

Aku sadar mungkin ada sikap dan tindakan yang kurang baik.

Aku benar-benar minta maaf.

Aku berjanji akan belajar menjadi pribadi yang lebih baik dan tidak mengulangi kesalahan yang sama.

Aku tidak menulis ini untuk memaksamu memaafkanku.

Aku hanya ingin jujur tentang apa yang ada di dalam hatiku.

Terima kasih karena pernah hadir dan memberi banyak warna dalam hidupku.

Dan jika masih diperbolehkan...

Jangan pergi dari kakak ya.

Kehadiranmu sangat berarti.

Semoga semua hal baik selalu menyertaimu.

Maafkan aku.

💙
`;

let i=0;

function type(){
if(i<text.length){
document.getElementById('typing').innerHTML+=text.charAt(i);
i++;
setTimeout(type,60);
}else{
document.getElementById('final').classList.add('show');
}
}

setTimeout(type,1500);

</script>

</body>
</html>
